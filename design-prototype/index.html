<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>Plate — AI calorie tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="device" id="device">
      <div class="statusbar"><span id="clock">9:41</span><span class="island"></span><span class="sb-icons"><i></i><i></i><i></i><b></b></span></div>

      <!-- HOME -->
      <main class="screen" id="screen-home">
        <header class="top">
          <div class="brand"><span class="logo"></span>Plate</div>
          <button class="streak" id="streak-btn"></button>
        </header>
        <div class="week" id="week"></div>

        <div class="carousel" id="carousel">
          <section class="page" id="page-1"></section>
          <section class="page" id="page-2"></section>
        </div>
        <div class="dots" id="dots"><i class="on"></i><i></i></div>

        <div class="section-head"><h3>Recently logged</h3><span class="muted" id="log-count"></span></div>
        <div id="log" class="log-list"></div>
      </main>

      <!-- PROGRESS -->
      <main class="screen hidden" id="screen-progress"></main>

      <!-- SETTINGS -->
      <main class="screen hidden" id="screen-settings"></main>

      <nav class="tabbar" id="tabbar">
        <button class="tab active" data-tab="home"></button>
        <button class="tab" data-tab="progress"></button>
        <button class="tab" data-tab="settings"></button>
      </nav>
      <button class="fab" id="fab" aria-label="Add"></button>

      <div class="backdrop" id="backdrop"></div>

      <!-- Quick actions -->
      <div class="quick" id="quick"></div>

      <!-- Generic bottom sheet -->
      <div class="sheet" id="sheet"><div class="grabber"></div><div class="sheet-body" id="sheet-body"></div></div>

      <!-- Full detail sheet -->
      <div class="detail" id="detail"></div>

      <!-- Camera -->
      <div class="camera" id="camera"></div>

      <div class="flash" id="flash"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <script>/* fit phone frame to window */(function(){const d=document.getElementById("device");const f=()=>{d.style.zoom=innerWidth<=500?"":Math.min(1,(innerHeight-56)/868).toFixed(3)};f();addEventListener("resize",f)})();</script>
  <script src="app.js"></script>
</body>
</html>
