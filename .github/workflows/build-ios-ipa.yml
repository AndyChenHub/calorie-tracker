name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      signed_eas_build:
        description: 'Also trigger a signed EAS Cloud Build (requires EXPO_TOKEN secret)'
        required: false
        default: false
        type: boolean
      eas_profile:
        description: 'EAS build profile (preview = Ad Hoc IPA, production = App Store IPA)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Standalone iOS IPA (macOS Xcode)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting Xcode at: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & lint
        run: |
          npm run typecheck
          npm run lint

      - name: Generate native iOS project (Expo Prebuild)
        env:
          CI: '1'
        run: |
          BASE_BUILD=$(node -p "parseInt(require('./app.json').expo.ios.buildNumber || '1', 10) || 1")
          EFFECTIVE_BUILD=$(( BASE_BUILD + ${GITHUB_RUN_NUMBER:-0} ))
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            app.expo.ios.buildNumber = String(${EFFECTIVE_BUILD});
            app.expo.android.versionCode = ${EFFECTIVE_BUILD};
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2) + '\n');
          "
          echo "Using bundleIdentifier=$(node -p "require('./app.json').expo.ios.bundleIdentifier") CFBundleVersion=${EFFECTIVE_BUILD}"
          npx expo prebuild --platform ios --clean --no-install
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        env:
          LANG: en_US.UTF-8
        run: pod install || pod install --repo-update

      - name: Compile Release iOS .app (arm64 iphoneos)
        env:
          CI: '1'
          NODE_ENV: production
        run: |
          PROJECT=$(ls -d ios/*.xcodeproj | head -n 1)
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | jq -r '.project.schemes[0]')
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "null" ]; then
            SCHEME=$(basename "$PROJECT" .xcodeproj)
          fi
          echo "Building workspace=$WORKSPACE project=$PROJECT scheme=$SCHEME"
          echo "APP_SCHEME=${SCHEME}" >> "$GITHUB_ENV"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/ios/build" \
            NODE_BINARY="$(command -v node)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package Payload into .ipa
        id: package_ipa
        run: |
          APP_PATH=$(find "$PWD/ios/build" -type d -path "*/Release-iphoneos/${APP_SCHEME}.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD/ios/build" -type d -name "*.app" ! -path "*/*.app/*" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Compiled .app bundle was not found in $PWD/ios/build"
            find "$PWD/ios/build" -maxdepth 4 || true
            exit 1
          fi

          echo "Found compiled app bundle: $APP_PATH"
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "::error::main.jsbundle missing inside $APP_PATH — Release JS bundle was not embedded"
            ls -la "$APP_PATH" || true
            exit 1
          fi

          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NUM=$(node -p "require('./app.json').expo.ios.buildNumber")
          IPA_NAME="Plate-v${VERSION}-build${BUILD_NUM}.ipa"

          rm -rf build-ipa "$IPA_NAME"
          mkdir -p build-ipa/Payload
          cp -R "$APP_PATH" build-ipa/Payload/
          (cd build-ipa && ditto -c -k --sequesterRsrc --keepParent Payload "../${IPA_NAME}")

          ls -lh "$IPA_NAME"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: Plate-iOS-IPA
          path: ${{ steps.package_ipa.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish .ipa to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_FILE="${{ steps.package_ipa.outputs.ipa_name }}"
          VERSION="${{ steps.package_ipa.outputs.app_version }}"
          BUILD_NUM="${{ steps.package_ipa.outputs.build_number }}"

          cp "$IPA_FILE" Plate.ipa

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${VERSION}-build.${BUILD_NUM}"
          fi

          TITLE="Plate v${VERSION} (Build ${BUILD_NUM})"

          if gh release view "$TAG_NAME" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$IPA_FILE" Plate.ipa \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$TAG_NAME" "$IPA_FILE" Plate.ipa \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --generate-notes \
              --latest
          fi

          {
            echo "### Published iOS Release: ${TITLE}"
            echo "- **Release Page:** https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            echo "- **Always-Latest Direct IPA Link:** https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Plate.ipa"
            echo "- **Versioned IPA Asset:** \`${IPA_FILE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-signed-eas-ipa:
    name: Trigger Signed EAS Cloud Build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_eas_build == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Trigger EAS iOS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Add an Expo Access Token under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx eas-cli@latest build --platform ios --profile "${{ inputs.eas_profile || 'preview' }}" --non-interactive --no-wait
